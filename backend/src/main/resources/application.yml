spring:
  application:
    name: jicp-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jicp}
    username: ${DB_USER:jicp}
    password: ${DB_PASSWORD:jicp}

  jpa:
    # El esquema lo gobierna Flyway. Hibernate solo VALIDA que las entidades
    # coincidan con las tablas: si alguien toca una sin migrar, el arranque falla.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration

jicp:
  seguridad:
    jwt:
      # El valor por defecto es de desarrollo y esta en el repositorio a proposito: sirve para
      # levantar la API sin configurar nada. En cuanto la API salga de localhost, JWT_SECRET
      # es obligatorio. El arranque avisa por log si se queda con este.
      secreto: ${JWT_SECRET:desarrollo-local-jicp-secreto-de-firma-cambiame-en-produccion}
      # Corta porque un access token no se puede revocar antes de que caduque.
      duracion-access: 15m
      # Larga porque el refresh si se puede revocar: vive en base de datos y rota en cada uso.
      duracion-refresh: 30d

    # Cuentas que nacen desde el servidor y no por la API: la primera de cada tipo no
    # puede crearla nadie por red, porque las altas exigen ya un rol. Solo actuan si sus
    # variables estan definidas y todavia no existe nadie con ese rol. Los nombres de las
    # variables se enlazan aqui a mano: Spring solo traduciria por si mismo
    # JICP_SEGURIDAD_ADMIN_INICIAL_EMAIL, que no es el nombre documentado.
    admin-inicial:
      email: ${JICP_ADMIN_INICIAL_EMAIL:}
      password: ${JICP_ADMIN_INICIAL_PASSWORD:}
    profesor-inicial:
      email: ${JICP_PROFESOR_INICIAL_EMAIL:}
      password: ${JICP_PROFESOR_INICIAL_PASSWORD:}
      id-colegio: ${JICP_PROFESOR_INICIAL_ID_COLEGIO:0}

  # Lo que recibe cada alumno al darse de alta. Lo decide el servidor, igual para todos:
  # nadie que llame a la API puede elegir con cuanto dinero empieza.
  saldo-inicial: ${JICP_SALDO_INICIAL:500000.00}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.jicp.api: DEBUG
